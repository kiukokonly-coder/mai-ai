<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAI-ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --space:#05060f; --text:#E9EAFF; --muted:#9AA0D0; --line:rgba(160,150,255,.28);
    --glass:rgba(18,15,46,.62); --violet:#8B7BFF; --cyan:#5BE3FF; --pink:#FF7BD5;
    --grad:linear-gradient(135deg,#8B7BFF,#5BE3FF);
    --ui:'Bricolage Grotesque',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{font-family:var(--ui);color:var(--text);background:var(--space);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
  #nebula{position:fixed;inset:0;z-index:-2;background:
    radial-gradient(ellipse 60% 50% at 15% 20%,rgba(120,70,255,.35),transparent 70%),
    radial-gradient(ellipse 55% 45% at 85% 30%,rgba(255,90,200,.20),transparent 70%),
    radial-gradient(ellipse 70% 50% at 50% 100%,rgba(40,140,255,.28),transparent 70%),var(--space)}
  #nebula{animation:drift 55s ease-in-out infinite alternate}
  @keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.2) translate(-2.5%,2%)}}
  @media (prefers-reduced-motion:reduce){#nebula{animation:none}}
  .bot .bubble{text-shadow:0 1px 10px rgba(5,6,15,.95)}
  #dust{position:fixed;inset:0;z-index:-2;animation:twinkle 5s ease-in-out infinite alternate;
    background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1.4px 1.4px at 90px 70px,#cfe9ff,transparent),radial-gradient(1.8px 1.8px at 150px 120px,#fff,transparent),radial-gradient(1px 1px at 60px 160px,#ffd6f2,transparent),radial-gradient(1.2px 1.2px at 190px 20px,#fff,transparent);
    background-size:263px 231px,197px 241px,311px 277px,179px 223px,337px 293px}
  @keyframes twinkle{from{opacity:.4}to{opacity:.95}}
  @media (prefers-reduced-motion:reduce){#dust{animation:none}}
  #stars{position:fixed;inset:0;z-index:-1;width:100%;height:100%}
  header{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .logo{background:var(--grad);color:#06081c;border-radius:10px;padding:3px 9px;font-weight:800;font-size:17px}
  .name{font-weight:800;font-size:20px;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:14px}
  #clear{margin-left:auto;background:none;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font:600 13px var(--ui);color:var(--text);cursor:pointer}
  #clear:hover{background:rgba(139,123,255,.2)}
  main{flex:1;overflow-y:auto;padding:24px 16px}
  .wrap{max-width:780px;margin:0 auto}
  .hero{padding:48px 0 24px}
  .hero h1{font-size:clamp(34px,7vw,60px);line-height:1.02;margin:0 0 14px;font-weight:800;letter-spacing:-.04em;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero p{margin:0 0 22px;color:var(--muted);font-size:18px;max-width:46ch}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:600 14px var(--ui);color:var(--text);cursor:pointer;backdrop-filter:blur(8px);transition:border-color .15s,background .15s}
  .chip:hover{border-color:var(--cyan);background:rgba(91,227,255,.1)}
  .row{display:flex;gap:12px;margin-bottom:22px}
  .row.user{justify-content:flex-end}
  .avatar{flex:none;width:32px;height:32px;border-radius:9px;background:var(--grad);color:#06081c;display:grid;place-items:center;font-weight:800;font-size:11px}
  .bubble{line-height:1.65;white-space:pre-wrap;word-break:break-word;min-width:0}
  .bot .bubble{flex:1}
  .user .bubble{background:linear-gradient(135deg,#6C5CFF,#3E7BFF);padding:10px 16px;border-radius:18px 18px 4px 18px;max-width:82%}
  .att{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .att img{height:64px;border-radius:8px;border:1px solid var(--line)}
  .tag{background:rgba(0,0,0,.3);border-radius:8px;padding:4px 8px;font-size:12px}
  pre{background:rgba(4,5,20,.85);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0;overflow-x:auto;position:relative;white-space:pre}
  code{font-family:var(--mono);font-size:13px;line-height:1.55;color:#DCE0FF}
  .copy{position:absolute;top:8px;right:8px;background:rgba(139,123,255,.25);color:var(--text);border:1px solid var(--line);border-radius:8px;font:600 12px var(--ui);padding:3px 10px;cursor:pointer}
  .dots span{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:50%;background:var(--cyan);animation:b 1s infinite}
  .dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
  @keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-6px)}}
  form{padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px))}
  .box{max-width:780px;margin:0 auto;background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:8px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
  #previews{display:flex;flex-wrap:wrap;gap:8px;padding:4px 4px 8px}
  #previews:empty{display:none}
  .pv{position:relative;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:12px;display:flex;align-items:center;gap:6px;max-width:180px}
  .pv img{height:36px;width:36px;object-fit:cover;border-radius:6px}
  .pv span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pv button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px;padding:0 2px}
  .bar{display:flex;gap:8px;align-items:flex-end}
  textarea{flex:1;resize:none;border:0;outline:0;background:none;font:400 16px var(--ui);color:var(--text);padding:8px 10px;max-height:140px}
  textarea::placeholder{color:var(--muted)}
  .clip{background:none;border:1px solid var(--line);color:var(--text);border-radius:12px;width:42px;height:42px;font-size:20px;cursor:pointer}
  .clip:hover{border-color:var(--cyan)}
  .send{background:var(--grad);color:#06081c;border:0;border-radius:12px;padding:0 20px;height:42px;font:800 15px var(--ui);cursor:pointer}
  .send:disabled{opacity:.5;cursor:default}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
</style>
</head>
<body>
<div id="nebula"></div><div id="dust"></div><canvas id="stars"></canvas>
<header>
  <span class="logo">MAI</span><span class="name">-ai</span><span class="sub">your coding assistant</span>
  <button id="clear" type="button">New chat</button>
</header>
<main id="main"><div class="wrap" id="chat"></div></main>

<form id="f">
  <div class="box">
    <div id="previews"></div>
    <div class="bar">
      <button class="clip" id="clip" type="button" title="Attach a file, picture, or video">📎</button>
      <input type="file" id="file" multiple hidden accept="image/*,video/*,.pdf,.txt,.md,.json,.csv,.js,.ts,.jsx,.tsx,.py,.html,.css,.java,.c,.cpp,.cs,.php,.go,.rs,.sql,.sh,.yml,.yaml,.xml">
      <textarea id="q" rows="1" placeholder="Ask about your code..."></textarea>
      <button class="send" id="b">Send</button>
    </div>
  </div>
</form>

<script>
/* ---------- galaxy: parang nasa space ka ---------- */
(function(){
  const c=document.getElementById('stars'),x=c.getContext('2d');
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,groups=[],st=[],shoot=null,mx=0,my=0,tx=0,ty=0,boost=0;
  window.galaxyWarp=()=>{boost=1};
  addEventListener('pointermove',e=>{tx=e.clientX/innerWidth-.5;ty=e.clientY/innerHeight-.5});
  const spawn=(z)=>({x:(Math.random()*2-1)*W*.5*z,y:(Math.random()*2-1)*H*.5*z,z:z,t:Math.random()<.2?'190,225,255':Math.random()<.12?'255,200,235':'255,255,255'});
  function size(){
    W=c.width=innerWidth;H=c.height=innerHeight;
    groups=[{col:'255,232,190',a:.9,p:[]},{col:'205,190,255',a:.7,p:[]},{col:'120,185,255',a:.6,p:[]}];
    for(let i=0;i<3600;i++){
      const r=Math.pow(Math.random(),.65),arm=i%4;
      const ang=arm*1.5708+r*5.2+(Math.random()-.5)*(.35+(1-r)*.9);
      groups[r<.22?0:r<.55?1:2].p.push({r,ang,s:Math.random()*1.6+.8});
    }
    st=Array.from({length:Math.round(Math.min(520,W*H/3500))},()=>spawn(Math.random()*.98+.02));
  }
  addEventListener('resize',()=>{size();if(still)frame(0)});size();

  function frame(t){
    mx+=(tx-mx)*.05;my+=(ty-my)*.05;
    x.globalCompositeOperation='source-over';x.clearRect(0,0,W,H);
    x.globalCompositeOperation='lighter';

    // spiral galaxy (dahan-dahang umiikot)
    const R=Math.min(W,H)*.62,gx=W*(W>700?.7:.5)-mx*36,gy=H*.36-my*24,tilt=-.38,ct=Math.cos(tilt),stt=Math.sin(tilt);
    const core=x.createRadialGradient(gx,gy,0,gx,gy,R*.38);
    core.addColorStop(0,'rgba(255,225,170,.55)');core.addColorStop(.35,'rgba(170,140,255,.18)');core.addColorStop(1,'rgba(0,0,0,0)');
    x.fillStyle=core;x.fillRect(gx-R,gy-R,R*2,R*2);
    const rot=still?0:t/45000;
    for(const g of groups){
      x.fillStyle='rgba('+g.col+','+g.a+')';
      for(const p of g.p){
        const an=p.ang+rot*(1.7-p.r),xx=Math.cos(an)*p.r*R,yy=Math.sin(an)*p.r*R*.42;
        x.fillRect(gx+xx*ct-yy*stt,gy+xx*stt+yy*ct,p.s,p.s);
      }
    }

    // mga bituin na lumalapit sa iyo
    const cx=W/2+mx*50,cy=H/2+my*50,sp=still?0:.0009+boost*.02;
    for(const s of st){
      const k=.9,sx=cx+s.x/s.z*k,sy=cy+s.y/s.z*k;
      const r=(1-s.z)*2.4+.8;
      x.fillStyle='rgba('+s.t+','+((1-s.z)*.6+.4)+')';
      if(boost>.06){
        const z2=s.z+sp*5,px=cx+s.x/z2*k,py=cy+s.y/z2*k;
        x.strokeStyle=x.fillStyle;x.lineWidth=r;x.beginPath();x.moveTo(px,py);x.lineTo(sx,sy);x.stroke();
      }else x.fillRect(sx,sy,r,r);
      s.z-=sp;
      if(s.z<=.02||sx<0||sx>W||sy<0||sy>H)Object.assign(s,spawn(1));
    }
    boost*=.94;

    // shooting star
    if(!still){
      if(!shoot&&Math.random()<.004)shoot={x:Math.random()*W*.8,y:Math.random()*H*.4,l:0};
      if(shoot){
        const g=x.createLinearGradient(shoot.x,shoot.y,shoot.x-100,shoot.y-50);
        g.addColorStop(0,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');
        x.strokeStyle=g;x.lineWidth=1.6;x.beginPath();x.moveTo(shoot.x,shoot.y);x.lineTo(shoot.x-100,shoot.y-50);x.stroke();
        shoot.x+=15;shoot.y+=7.5;if(++shoot.l>45)shoot=null;
      }
      requestAnimationFrame(frame);
    }
  }
  frame(0);
})();

/* ---------- chat ---------- */
const chat=document.getElementById('chat'),main=document.getElementById('main'),q=document.getElementById('q'),b=document.getElementById('b'),
  fileIn=document.getElementById('file'),prev=document.getElementById('previews');
let history=[],pending=[];
const IDEAS=['Fix an error in my code','Build a login form (HTML/CSS/JS)','Explain async/await','Review my code'];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const render=t=>t.split(/```/).map((p,i)=>i%2===0?esc(p):'<pre><button type="button" class="copy">Copy</button><code>'+esc(p.replace(/^[\w+#-]*\n/,''))+'</code></pre>').join('');
const scroll=()=>{main.scrollTop=main.scrollHeight};

function home(){
  history=[];pending=[];drawPrev();
  chat.innerHTML='<div class="hero"><h1>What are we coding today?</h1><p>I\'m MAI-ai. I only do code: ask questions, debug, or attach a screenshot, file, or video of your error.</p><div class="chips" id="chips"></div></div>';
  IDEAS.forEach(t=>{const e=document.createElement('button');e.type='button';e.className='chip';e.textContent=t;e.onclick=()=>{q.value=t;send()};document.getElementById('chips').appendChild(e)});
}
function add(role,html){
  const r=document.createElement('div');r.className='row '+role;
  r.innerHTML=role==='user'?'<div class="bubble">'+html+'</div>':'<div class="avatar">MAI</div><div class="bubble">'+html+'</div>';
  chat.appendChild(r);scroll();return r.querySelector('.bubble');
}
chat.addEventListener('click',e=>{if(e.target.classList.contains('copy')){navigator.clipboard.writeText(e.target.nextElementSibling.textContent);e.target.textContent='Copied!';setTimeout(()=>e.target.textContent='Copy',1200)}});
document.getElementById('clear').onclick=home;

/* ---------- attachments ---------- */
const b64=d=>d.split(',')[1];
const readAs=(f,m)=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r[m](f)});
function shrink(src,w,h){const k=Math.min(1,1280/Math.max(w,h)),c=document.createElement('canvas');c.width=w*k;c.height=h*k;return c}
function imgBlock(c){const d=c.toDataURL('image/jpeg',.85);return{thumb:d,block:{type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64(d)}}}}

async function fromImage(f){
  const url=URL.createObjectURL(f),im=new Image();
  await new Promise((ok,no)=>{im.onload=ok;im.onerror=no;im.src=url});
  const c=shrink(im,im.width,im.height);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  URL.revokeObjectURL(url);const r=imgBlock(c);
  return{name:f.name,thumb:r.thumb,blocks:[r.block]};
}
async function fromVideo(f){
  const url=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.preload='auto';v.src=url;
  await new Promise((ok,no)=>{v.onloadedmetadata=ok;v.onerror=no});
  const blocks=[],n=4;let thumb='';
  for(let i=0;i<n;i++){
    v.currentTime=Math.max(0,v.duration*(i+.5)/n);
    await new Promise(ok=>v.onseeked=ok);
    const c=shrink(v,v.videoWidth,v.videoHeight);c.getContext('2d').drawImage(v,0,0,c.width,c.height);
    const r=imgBlock(c);if(!i)thumb=r.thumb;blocks.push(r.block);
  }
  URL.revokeObjectURL(url);
  blocks.push({type:'text',text:'[The '+n+' pictures above are frames from the video "'+f.name+'", in order. No audio.]'});
  return{name:f.name,thumb,blocks};
}
async function fromPdf(f){
  if(f.size>3e6)throw new Error(f.name+' is too large (max 3 MB for PDFs).');
  return{name:f.name,blocks:[{type:'document',source:{type:'base64',media_type:'application/pdf',data:b64(await readAs(f,'readAsDataURL'))}}]};
}
async function fromText(f){
  if(f.size>1e5)throw new Error(f.name+' is too large (max 100 KB for code files).');
  return{name:f.name,blocks:[{type:'text',text:'File: '+f.name+'\n```\n'+await readAs(f,'readAsText')+'\n```'}]};
}
fileIn.onchange=async()=>{
  for(const f of fileIn.files){
    if(pending.length>=5){alert('Maximum of 5 attachments.');break}
    try{
      pending.push(f.type.startsWith('image/')?await fromImage(f):f.type.startsWith('video/')?await fromVideo(f):f.type==='application/pdf'?await fromPdf(f):await fromText(f));
    }catch(e){alert(e.message||("Couldn't read "+f.name))}
  }
  fileIn.value='';drawPrev();
};
document.getElementById('clip').onclick=()=>fileIn.click();
function drawPrev(){
  prev.innerHTML='';
  pending.forEach((a,i)=>{
    const d=document.createElement('div');d.className='pv';
    d.innerHTML=(a.thumb?'<img src="'+a.thumb+'">':'')+'<span>'+esc(a.name)+'</span><button type="button" aria-label="Remove">×</button>';
    d.querySelector('button').onclick=()=>{pending.splice(i,1);drawPrev()};
    prev.appendChild(d);
  });
}

/* ---------- send ---------- */
function forApi(){ // iisang beses lang ipapadala ang picture/PDF, para hindi lumaki ang bayad
  return history.map((m,i)=>i===history.length-1||typeof m.content==='string'?m:
    {role:m.role,content:m.content.map(c=>c.type==='image'||c.type==='document'?{type:'text',text:'[attachment shown earlier]'}:c)});
}
async function send(){
  const text=q.value.trim();
  if(!text&&!pending.length)return;
  if(!history.length)chat.innerHTML='';
  const files=pending;pending=[];drawPrev();q.value='';b.disabled=true;window.galaxyWarp&&galaxyWarp();
  const shown=(files.length?'<div class="att">'+files.map(a=>a.thumb?'<img src="'+a.thumb+'">':'<span class="tag">📄 '+esc(a.name)+'</span>').join('')+'</div>':'')+esc(text);
  add('user',shown);
  history.push({role:'user',content:files.length?[...files.flatMap(a=>a.blocks),{type:'text',text:text||'Take a look at this and help me.'}]:text});
  const bub=add('bot','<span class="dots"><span></span><span></span><span></span></span>');
  try{
    const r=await fetch('/.netlify/functions/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:forApi()})});
    const raw=await r.text();let d;
    try{d=JSON.parse(raw)}catch(e){throw new Error('The MAI-ai backend is not working yet. Make sure netlify/functions/chat.js is deployed and GEMINI_API_KEY is set in Netlify.')}
    if(!r.ok)throw new Error(d.error||'Something went wrong. Please try again.');
    history.push({role:'assistant',content:d.reply});bub.innerHTML=render(d.reply);
  }catch(err){history.pop();bub.textContent=err.message||"Couldn't connect. Please try again."}
  b.disabled=false;q.focus();scroll();
}
document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();send()});
q.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});
home();
</script>
</body>
</html>
